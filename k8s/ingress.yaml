apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventhub-ingress
  namespace: eventhub-kct
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: eventhub.kct.ac.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eventhub-service
                port:
                  number: 80
