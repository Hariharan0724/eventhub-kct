# =========================================================================
# Google App Engine (PaaS) Deployment Descriptor
# Course: Cloud Application Development (CAD)
# Institution: Kumaraguru College of Technology (KCT), Coimbatore
# =========================================================================

runtime: nodejs20
env: standard
instance_class: F1

# Automatic horizontal scaling configuration
automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 8
  min_pending_latency: 30ms
  max_pending_latency: automatic

# Cloud environment settings
env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  # Firebase / Google Cloud Firestore is natively authenticated within GCP
  # No external service account key file required when running on App Engine

# Handlers and routing
handlers:
  # Static assets routing
  - url: /css
    static_dir: frontend/css
    secure: always

  - url: /js
    static_dir: frontend/js
    secure: always

  - url: /assets
    static_dir: frontend/assets
    secure: always

  # Catch-all routed to Node.js Express server
  - url: /.*
    script: auto
    secure: always
